<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c0e">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TDK Atlas">
<meta name="description" content="TDKの技術力と世界シェアを、2026年10月15日時点の公開情報をもとに3Dで巡る非公式の学習サイト。">
<meta property="og:title" content="TDK Technology Atlas 2026">
<meta property="og:description" content="フェライトからAIの時代へ。TDKの技術と世界シェアを3Dで巡る非公式の学習サイト。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@300;400;500;600&family=Shippori+Mincho+B1:wght@500;600;700&display=swap">
<title>TDK Technology Atlas 2026</title>
<style>/* Layout: full-bleed 3D stage; museum-caption on the left third, a precision
   ruler as the progress rail along the bottom, instrument-like icon buttons. */
:root {
  --ink: #0b0c0e;
  --ink-2: #121418;
  --paper: #ece6da;
  --paper-2: rgba(236, 230, 218, 0.74);
  --muted: #9a9ea6;
  --copper: #c58a5c;
  --copper-2: #e2b48a;
  --cobalt: #8aa6c8;
  --line: rgba(236, 230, 218, 0.16);
  --line-2: rgba(236, 230, 218, 0.32);
  --glass: rgba(12, 13, 16, 0.6);
  --glass-2: rgba(12, 13, 16, 0.86);
  --shadow-text: 0 1px 18px rgba(0, 0, 0, 0.55);
  --font-display: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', 'YuMincho', serif;
  --font-body: 'IBM Plex Sans JP', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --pad: clamp(16px, 2.6vw, 44px);
  --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
  color-scheme: dark;
}

#ui[data-tone='light'] {
  --paper: #17191d;
  --paper-2: rgba(23, 25, 29, 0.78);
  --muted: #5d636c;
  --line: rgba(23, 25, 29, 0.16);
  --line-2: rgba(23, 25, 29, 0.32);
  --glass: rgba(246, 244, 239, 0.62);
  --glass-2: rgba(246, 244, 239, 0.92);
  --shadow-text: 0 1px 16px rgba(255, 255, 255, 0.45);
  --copper: #a8653a;
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
  background: var(--ink);
  color: var(--paper);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
body {
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--ink);
  touch-action: none;
}
#gl {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: grab;
}
#gl:active {
  cursor: grabbing;
}
#ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
  color: var(--paper);
  transition: color 0.8s var(--ease);
}
button {
  font: inherit;
  color: inherit;
}

/* ------------------------------------------------------------------ loader */
.loader {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  background: radial-gradient(120% 90% at 60% 55%, #1a1814 0%, #0b0c0e 60%);
  pointer-events: auto;
  transition: opacity 1.1s var(--ease), visibility 1.1s;
}
.loader.done {
  opacity: 0;
  visibility: hidden;
}
.loader-inner {
  display: grid;
  gap: 14px;
  justify-items: center;
  text-align: center;
}
.loader-mark {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 9px solid #2c2d31;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06), 0 0 0 1px rgba(197, 138, 92, 0.35);
  position: relative;
  animation: loaderSpin 6s linear infinite;
}
.loader-mark span {
  position: absolute;
  inset: -9px;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: var(--copper);
  border-right-color: rgba(197, 138, 92, 0.35);
}
@keyframes loaderSpin {
  to {
    transform: rotate(360deg);
  }
}
.loader-title {
  font-family: var(--font-mono);
  letter-spacing: 0.32em;
  font-size: 12px;
  color: var(--paper);
}
.loader-title em {
  font-style: normal;
  color: var(--copper-2);
}
.loader-sub {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.08em;
}
.loader-meter {
  width: 180px;
  height: 1px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
}
.loader-bar {
  height: 100%;
  background: linear-gradient(90deg, #7a4f30, var(--copper-2));
  transform-origin: 0 50%;
  transform: scaleX(0);
  transition: transform 0.5s var(--ease);
}
.loader-temp {
  font-family: var(--font-mono);
  font-size: 22px;
  color: var(--copper-2);
  font-variant-numeric: tabular-nums;
}
.loader-temp small {
  font-size: 12px;
  margin-left: 2px;
  color: var(--muted);
}

/* ------------------------------------------------------------------ topbar */
.topbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  padding: calc(var(--safe-t) + 12px) calc(var(--safe-r) + var(--pad)) 0 calc(var(--safe-l) + var(--pad));
  z-index: 10;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.24em;
  white-space: nowrap;
  min-width: 0;
}
.brand-mark {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 3.5px solid var(--paper);
  opacity: 0.9;
  flex: none;
  box-shadow: 0 0 0 1px var(--copper);
}
.brand-name {
  color: var(--paper);
}
.brand-date {
  color: var(--muted);
  letter-spacing: 0.14em;
}
.top-chapter {
  display: flex;
  gap: 10px;
  align-items: baseline;
  font-size: 12px;
  color: var(--paper-2);
  white-space: nowrap;
}
.tc-num {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.18em;
  color: var(--copper-2);
}
#ui[data-tone='light'] .tc-num {
  color: var(--copper);
}
.top-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.ic-btn {
  pointer-events: auto;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line-2);
  background: var(--glass);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: border-color 0.3s, background 0.3s, transform 0.3s var(--ease);
  padding: 0;
}
.ic-btn:hover {
  border-color: var(--copper);
}
.ic-btn:active {
  transform: scale(0.94);
}
.ic-btn:focus-visible,
.pill:focus-visible,
.tick:focus-visible {
  outline: 2px solid var(--copper-2);
  outline-offset: 2px;
}
.ic-btn svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ------------------------------------------------------------------ caption */
.scrim {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background:
    radial-gradient(120% 90% at 0% 50%, rgba(8, 9, 11, 0.62) 0%, rgba(8, 9, 11, 0.38) 34%, rgba(8, 9, 11, 0) 62%),
    linear-gradient(180deg, rgba(8, 9, 11, 0.42) 0%, rgba(8, 9, 11, 0) 14%, rgba(8, 9, 11, 0) 84%, rgba(8, 9, 11, 0.5) 100%);
  transition: opacity 0.9s var(--ease);
}
#ui[data-tone='light'] .scrim {
  background:
    radial-gradient(120% 90% at 0% 50%, rgba(244, 241, 235, 0.7) 0%, rgba(244, 241, 235, 0.4) 34%, rgba(244, 241, 235, 0) 62%),
    linear-gradient(180deg, rgba(244, 241, 235, 0.4) 0%, rgba(244, 241, 235, 0) 14%, rgba(244, 241, 235, 0) 84%, rgba(244, 241, 235, 0.45) 100%);
}
#ui[data-scrim='off'] .scrim {
  opacity: 0;
}
html.portrait .scrim {
  background: linear-gradient(0deg, rgba(8, 9, 11, 0.8) 0%, rgba(8, 9, 11, 0.5) 40%, rgba(8, 9, 11, 0) 62%);
}
html.portrait #ui[data-tone='light'] .scrim {
  background: linear-gradient(0deg, rgba(244, 241, 235, 0.85) 0%, rgba(244, 241, 235, 0.5) 40%, rgba(244, 241, 235, 0) 62%);
}
.caption-wrap {
  position: absolute;
  left: calc(var(--safe-l) + var(--pad));
  top: calc(var(--safe-t) + 64px);
  bottom: calc(var(--safe-b) + 64px);
  width: min(44vw, 580px);
  display: grid;
  align-items: center;
  z-index: 5;
}
.caption {
  grid-area: 1 / 1;
  display: grid;
  gap: clamp(8px, 1.8vh, 18px);
  align-content: center;
  text-shadow: var(--shadow-text);
}
.caption.center {
  justify-items: start;
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: clamp(10px, 1.5vh, 12px);
  letter-spacing: 0.16em;
  color: var(--copper-2);
}
#ui[data-tone='light'] .eyebrow {
  color: var(--copper);
}
.eb-line {
  width: 28px;
  height: 1px;
  background: currentColor;
  transform-origin: 0 50%;
}
.title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(22px, calc(4.2vh + 1.1vw), 60px);
  line-height: 1.3;
  letter-spacing: 0.02em;
  color: var(--paper);
  text-wrap: balance;
  perspective: 600px;
}
.caption.big .title {
  font-size: clamp(26px, calc(5.4vh + 1.5vw), 78px);
  line-height: 1.22;
}
.title .word {
  display: inline-block;
  white-space: nowrap;
}
.title .ch {
  display: inline-block;
  will-change: transform, opacity, filter;
}
.lead {
  margin: 0;
  font-size: clamp(12px, calc(1.55vh + 0.42vw), 17px);
  line-height: 1.85;
  font-weight: 400;
  color: var(--paper-2);
  max-width: 35em;
}
.lead b,
.lead strong {
  color: var(--paper);
  font-weight: 500;
}
.lead em {
  font-style: normal;
  color: var(--copper-2);
}
#ui[data-tone='light'] .lead em {
  color: var(--copper);
}
.stats {
  display: grid;
  grid-template-columns: repeat(var(--cols, 3), minmax(0, auto));
  justify-content: start;
  gap: clamp(10px, 2.2vw, 34px);
  padding-top: clamp(4px, 1vh, 10px);
  border-top: 1px solid var(--line);
  margin-top: 2px;
}
.stats.n1 {
  --cols: 1;
}
.stats.n2 {
  --cols: 2;
}
.stats.n4 {
  --cols: 4;
}
.stat {
  min-width: 0;
  padding-top: clamp(6px, 1.1vh, 10px);
}
.sv {
  display: flex;
  align-items: baseline;
  gap: 3px;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: clamp(20px, calc(3.4vh + 0.6vw), 44px);
  line-height: 1.05;
  letter-spacing: -0.01em;
  color: var(--paper);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.sv .unit,
.sv .pre {
  font-size: 0.42em;
  font-weight: 400;
  color: var(--paper-2);
  letter-spacing: 0.02em;
}
.sv-text {
  font-family: var(--font-display);
}
.sl {
  margin-top: 4px;
  font-size: clamp(10px, 1.45vh, 12.5px);
  color: var(--muted);
  line-height: 1.45;
  max-width: 14em;
}
.note {
  margin: 0;
  font-size: clamp(9.5px, 1.3vh, 11.5px);
  color: var(--muted);
  line-height: 1.6;
  max-width: 44em;
}
.cap-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 2px;
}
.pill {
  pointer-events: auto;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--glass);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  padding: 9px 16px;
  font-size: 12.5px;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: border-color 0.3s, background 0.3s, color 0.3s;
  white-space: nowrap;
}
.pill:hover {
  border-color: var(--copper);
}
.pill.primary {
  background: linear-gradient(180deg, #d39a6a, #a8693f);
  border-color: transparent;
  color: #120c08;
  font-weight: 600;
  text-shadow: none;
  padding: 10px 22px;
}

/* kinetic caption animation */
.caption.in .ch {
  opacity: 0;
  transform: translateY(0.55em) rotateX(-55deg);
  filter: blur(8px);
  animation: chIn 1s var(--ease) forwards;
  animation-delay: calc(var(--i) * 20ms + 140ms);
}
@keyframes chIn {
  to {
    opacity: 1;
    transform: none;
    filter: blur(0);
  }
}
.caption.in .eyebrow {
  animation: fadeUp 0.9s var(--ease) both;
}
.caption.in .eb-line {
  animation: lineIn 1s var(--ease) both;
}
.caption.in .lead {
  animation: fadeUp 1.1s var(--ease) both;
  animation-delay: calc(min(var(--n, 10), 30) * 14ms + 260ms);
}
.caption.in .stats {
  animation: fadeUp 1s var(--ease) both;
  animation-delay: 560ms;
}
.caption.in .stat {
  animation: fadeUp 1s var(--ease) both;
  animation-delay: calc(620ms + var(--d) * 110ms);
}
.caption.in .note,
.caption.in .cap-actions {
  animation: fadeUp 1s var(--ease) both;
  animation-delay: 820ms;
}
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(14px);
    filter: blur(4px);
  }
  to {
    opacity: 1;
    transform: none;
    filter: blur(0);
  }
}
@keyframes lineIn {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}
.caption.out {
  pointer-events: none;
  transition: opacity 0.45s var(--ease), transform 0.6s var(--ease), filter 0.5s;
  opacity: 0;
  filter: blur(6px);
}
.caption.out-up {
  transform: translateY(-26px);
}
.caption.out-down {
  transform: translateY(26px);
}

/* ------------------------------------------------------------------ labels */
.labels {
  position: absolute;
  inset: 0;
  z-index: 4;
  overflow: hidden;
}
.lbl {
  position: absolute;
  left: 0;
  top: 0;
  opacity: 0;
  transition: opacity 0.5s var(--ease);
  will-change: transform;
}
.lbl.on {
  opacity: 1;
}
.lbl .dot {
  position: absolute;
  left: -4px;
  top: -4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1.5px solid var(--copper-2);
  background: rgba(11, 12, 14, 0.4);
}
.lbl .leader {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--len);
  height: 1px;
  background: linear-gradient(90deg, var(--copper-2), rgba(236, 230, 218, 0.6));
  transform-origin: 0 0;
  transform: rotate(var(--ang)) translateX(5px);
  opacity: 0.8;
}
.lbl .box {
  position: absolute;
  left: var(--dx);
  top: var(--dy);
  transform: translate(6px, -50%);
  display: grid;
  gap: 1px;
  padding: 5px 9px 6px;
  border-left: 1px solid var(--copper-2);
  background: var(--glass);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  white-space: nowrap;
  font-size: clamp(10.5px, 1.55vh, 12.5px);
  line-height: 1.35;
}
.lbl.left .box {
  transform: translate(calc(-100% - 6px), -50%);
  border-left: none;
  border-right: 1px solid var(--copper-2);
  text-align: right;
}
.lbl .box b {
  font-weight: 500;
  color: var(--paper);
}
.lbl .box small {
  font-family: var(--font-mono);
  font-size: 0.82em;
  color: var(--muted);
  letter-spacing: 0.02em;
}
.lbl.big .box {
  font-size: clamp(12px, 1.9vh, 15px);
}
.lbl.big .box b {
  font-family: var(--font-display);
  font-weight: 600;
}

/* ------------------------------------------------------------------ rail */
.rail {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center;
  gap: 14px;
  padding: 0 calc(var(--safe-r) + var(--pad)) calc(var(--safe-b) + 12px) calc(var(--safe-l) + var(--pad));
  z-index: 10;
}
.ruler {
  position: relative;
  height: 28px;
  pointer-events: auto;
}
.ruler-track {
  position: absolute;
  left: 6px;
  right: 6px;
  top: 0;
  bottom: 0;
  border-bottom: 1px solid var(--line);
}
.tick {
  position: absolute;
  bottom: 0;
  width: 9px;
  height: 22px;
  margin-left: -4.5px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
}
.tick::after {
  content: '';
  position: absolute;
  left: 4px;
  bottom: 0;
  width: 1px;
  height: 6px;
  background: var(--line-2);
  transition: background 0.4s, height 0.4s;
}
.tick.major::after {
  height: 11px;
}
.tick.done::after {
  background: var(--paper-2);
}
.tick span {
  position: absolute;
  bottom: 13px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 8.5px;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.ruler-marker {
  position: absolute;
  bottom: -1px;
  width: 2px;
  height: 18px;
  margin-left: 5px;
  background: var(--copper-2);
  transition: left 0.9s var(--ease);
  box-shadow: 0 0 10px rgba(226, 180, 138, 0.35);
}
.rail-count {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--muted);
  display: flex;
  gap: 6px;
  font-variant-numeric: tabular-nums;
}
.rail-count b {
  color: var(--paper);
  font-weight: 500;
}

/* ------------------------------------------------------------------ hint */
.hint {
  position: absolute;
  right: calc(var(--safe-r) + var(--pad));
  bottom: calc(var(--safe-b) + 58px);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11.5px;
  color: var(--paper-2);
  letter-spacing: 0.06em;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.8s var(--ease), transform 0.8s var(--ease);
}
.hint.on {
  opacity: 1;
  transform: none;
}
.hint-ico {
  width: 16px;
  height: 26px;
  border: 1px solid var(--line-2);
  border-radius: 9px;
  position: relative;
}
.hint-ico::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 6px;
  width: 2px;
  height: 6px;
  margin-left: -1px;
  border-radius: 1px;
  background: var(--copper-2);
  animation: hintDot 1.8s var(--ease) infinite;
}
@keyframes hintDot {
  0% {
    transform: translateY(0);
    opacity: 1;
  }
  80% {
    transform: translateY(8px);
    opacity: 0;
  }
  100% {
    opacity: 0;
  }
}

/* ------------------------------------------------------------------ panel */
.panel {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(480px, 58vw);
  z-index: 30;
  pointer-events: auto;
  background: var(--glass-2);
  -webkit-backdrop-filter: blur(22px) saturate(1.1);
  backdrop-filter: blur(22px) saturate(1.1);
  border-left: 1px solid var(--line);
  display: grid;
  grid-template-rows: auto 1fr;
  transform: translateX(104%);
  transition: transform 0.8s var(--ease);
  padding-right: var(--safe-r);
  touch-action: pan-y;
}
.panel.open {
  transform: none;
}
.panel-head {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 12px;
  padding: calc(var(--safe-t) + 18px) 22px 12px 26px;
  border-bottom: 1px solid var(--line);
}
.panel-kicker {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.2em;
  color: var(--copper-2);
}
.panel-title {
  grid-column: 1;
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
}
.panel-close {
  grid-column: 2;
  grid-row: 1 / span 2;
  align-self: center;
}
.panel-body {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 16px 26px calc(var(--safe-b) + 40px);
  font-size: 13.5px;
  line-height: 1.85;
  color: var(--paper-2);
}
.panel-body h3 {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  color: var(--paper);
  margin: 26px 0 8px;
  line-height: 1.45;
}
.panel-body h3:first-child {
  margin-top: 6px;
}
.panel-body p {
  margin: 0 0 12px;
}
.panel-body b,
.panel-body strong {
  color: var(--paper);
  font-weight: 500;
}
.panel-body ul,
.panel-body ol {
  margin: 0 0 14px;
  padding-left: 1.2em;
}
.panel-body li {
  margin: 2px 0;
}
.panel-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 6px 0 16px;
  font-size: 12.5px;
}
.panel-body th,
.panel-body td {
  text-align: left;
  padding: 7px 6px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.panel-body th {
  color: var(--muted);
  font-weight: 400;
  font-size: 11.5px;
}
.panel-body td.num {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--paper);
}
.panel-body .tbl {
  overflow-x: auto;
}
.panel-body .kv {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 14px;
  margin: 0 0 14px;
}
.panel-body .kv dt {
  color: var(--muted);
  font-size: 12px;
}
.panel-body .kv dd {
  margin: 0;
  color: var(--paper);
}
.panel-body .callout {
  border-left: 2px solid var(--copper);
  padding: 8px 12px;
  margin: 12px 0 16px;
  background: rgba(197, 138, 92, 0.08);
  color: var(--paper);
}
.panel-body .sources {
  margin-top: 26px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 11.5px;
  line-height: 1.7;
}
.panel-body .sources h4 {
  margin: 0 0 6px;
  font-family: var(--font-mono);
  font-weight: 500;
  letter-spacing: 0.16em;
  font-size: 10.5px;
  color: var(--muted);
}
.panel-body a {
  color: var(--copper-2);
  text-decoration: underline;
  text-decoration-color: rgba(226, 180, 138, 0.35);
  text-underline-offset: 2px;
  word-break: break-all;
}

/* ------------------------------------------------------------------ menu */
.menu {
  position: absolute;
  inset: 0;
  z-index: 40;
  pointer-events: none;
  background: rgba(8, 9, 11, 0.72);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  opacity: 0;
  transition: opacity 0.5s var(--ease);
  color: #ece6da;
}
.menu.open {
  opacity: 1;
  pointer-events: auto;
}
.menu-inner {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: calc(var(--safe-t) + 18px) calc(var(--safe-r) + var(--pad)) calc(var(--safe-b) + 24px) calc(var(--safe-l) + var(--pad));
  touch-action: pan-y;
}
.menu-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}
.menu-head h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  flex: 1;
}
.menu-kicker {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.22em;
  color: #e2b48a;
}
.menu-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px;
}
.menu-item button {
  width: 100%;
  text-align: left;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0 12px;
  padding: 11px 12px;
  border-radius: 6px;
  border: 1px solid rgba(236, 230, 218, 0.12);
  background: rgba(236, 230, 218, 0.03);
  cursor: pointer;
  transition: border-color 0.3s, background 0.3s;
}
.menu-item button:hover,
.menu-item.current button {
  border-color: #c58a5c;
  background: rgba(197, 138, 92, 0.1);
}
.mi-num {
  grid-row: span 2;
  font-family: var(--font-mono);
  font-size: 12px;
  color: #e2b48a;
  padding-top: 2px;
}
.mi-title {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.35;
}
.mi-sub {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.14em;
  color: #9a9ea6;
}
.menu-foot {
  margin-top: 18px;
  display: grid;
  gap: 10px;
}
.menu-quality {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  font-size: 12px;
  color: #9a9ea6;
}
.menu-quality span {
  margin-right: 6px;
}
.menu-quality button {
  border-radius: 999px;
  border: 1px solid rgba(236, 230, 218, 0.2);
  background: transparent;
  padding: 5px 12px;
  font-size: 12px;
  cursor: pointer;
}
.menu-quality button.on {
  border-color: #c58a5c;
  background: rgba(197, 138, 92, 0.16);
  color: #ece6da;
}
.menu-note {
  margin: 0;
  font-size: 11.5px;
  color: #9a9ea6;
  line-height: 1.7;
}
.menu-note b {
  color: #ece6da;
  font-weight: 500;
}

/* ------------------------------------------------------------------ rotate */
.rotate {
  position: absolute;
  inset: 0;
  z-index: 45;
  display: grid;
  place-items: center;
  background: rgba(8, 9, 11, 0.86);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s var(--ease);
  text-align: center;
  padding: 24px;
  color: #ece6da;
}
.rotate.on {
  opacity: 1;
  pointer-events: auto;
}
.rotate-inner {
  display: grid;
  gap: 12px;
  justify-items: center;
}
.rotate-phone {
  width: 40px;
  height: 68px;
  border: 2px solid #ece6da;
  border-radius: 9px;
  position: relative;
  animation: phoneTurn 2.6s var(--ease) infinite;
  margin-bottom: 8px;
}
.rotate-phone span {
  position: absolute;
  left: 50%;
  bottom: 5px;
  width: 10px;
  height: 2px;
  margin-left: -5px;
  border-radius: 2px;
  background: #c58a5c;
}
@keyframes phoneTurn {
  0%,
  20% {
    transform: rotate(0);
  }
  55%,
  85% {
    transform: rotate(-90deg);
  }
  100% {
    transform: rotate(0);
  }
}
.rotate-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
}
.rotate-text {
  margin: 0;
  font-size: 13px;
  color: #9a9ea6;
}

/* ------------------------------------------------------------------ toast */
.toast {
  position: absolute;
  left: 50%;
  bottom: calc(var(--safe-b) + 64px);
  transform: translate(-50%, 20px);
  max-width: min(520px, 86vw);
  padding: 12px 16px;
  border-radius: 8px;
  background: var(--glass-2);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  font-size: 12.5px;
  line-height: 1.7;
  opacity: 0;
  transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
  z-index: 60;
}
.toast.on {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ------------------------------------------------------------------ compact (landscape phones) */
html.compact .topbar {
  padding-top: calc(var(--safe-t) + 8px);
}
html.compact .ic-btn {
  width: 32px;
  height: 32px;
}
html.compact .brand-date {
  display: none;
}
html.compact .caption-wrap {
  top: calc(var(--safe-t) + 46px);
  bottom: calc(var(--safe-b) + 46px);
  width: min(46vw, 520px);
}
html.compact .rail {
  padding-bottom: calc(var(--safe-b) + 6px);
  gap: 10px;
}
html.compact .ruler {
  height: 24px;
}
html.compact .hint {
  bottom: calc(var(--safe-b) + 44px);
}
html.compact .pill {
  padding: 7px 13px;
  font-size: 11.5px;
}
html.compact .pill.primary {
  padding: 8px 18px;
}
html.compact .lead {
  line-height: 1.7;
}

/* ------------------------------------------------------------------ portrait */
html.portrait .caption-wrap {
  left: calc(var(--safe-l) + 18px);
  right: calc(var(--safe-r) + 18px);
  width: auto;
  top: auto;
  bottom: calc(var(--safe-b) + 58px);
  height: 48%;
  align-items: end;
}
html.portrait .title {
  font-size: clamp(22px, 6.4vw, 34px);
}
html.portrait .lead {
  font-size: 13px;
}
html.portrait .top-chapter {
  display: none;
}
html.portrait .panel {
  width: 100%;
}
html.portrait .brand-date {
  display: none;
}

@media (max-width: 760px) {
  .top-chapter {
    display: none;
  }
  .topbar {
    grid-template-columns: 1fr auto;
  }
}

@media (prefers-reduced-motion: reduce) {
  .caption.in .ch,
  .caption.in .lead,
  .caption.in .stats,
  .caption.in .stat,
  .caption.in .note,
  .caption.in .cap-actions,
  .caption.in .eyebrow {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
  }
}
</style>
